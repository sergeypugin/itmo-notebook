name: Deploy Quartz site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to deploy; leave empty to use the selected branch revision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deployment is restricted to the main branch; selected ref: $GITHUB_REF" >&2
            exit 1
          fi

  build:
    needs: [validate-ref]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Verify revision belongs to main
        env:
          DEPLOY_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$DEPLOY_REVISION" origin/main; then
            echo "Deployment revision is not reachable from main: $DEPLOY_REVISION" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install plugins
        run: npx quartz plugin install --from-config

      - name: Set baseUrl for GitHub Pages
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$REPOSITORY_NAME" = "$REPOSITORY_OWNER.github.io" ]; then
            base_url="$REPOSITORY_OWNER.github.io"
          else
            base_url="$REPOSITORY_OWNER.github.io/$REPOSITORY_NAME"
          fi
          sed -i "s|baseUrl:.*|baseUrl: $base_url|" quartz.config.yaml

      - name: Build Quartz
        run: npx quartz build -d itmo-notebook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
