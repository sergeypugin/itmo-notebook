name: Validate, format, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install tooling
        run: npm ci --prefix scripts

      - name: Normalize content
        if: github.event_name == 'push'
        run: python scripts/normalize.py

      - name: Require normalized content
        if: github.event_name == 'pull_request'
        run: python scripts/normalize.py --check

      - name: Apply EditorConfig rules
        if: github.event_name == 'push'
        run: git ls-files -z | xargs -0 ./scripts/node_modules/.bin/eclint fix

      - name: Check EditorConfig rules
        if: github.event_name == 'pull_request'
        run: git ls-files -z | xargs -0 ./scripts/node_modules/.bin/eclint check

      - name: Run script tests
        run: python -m unittest discover -s scripts/tests -t .

      - name: Restore workflow files
        if: github.event_name == 'push'
        run: git checkout -- .github/workflows/

      - name: Commit formatting changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: normalize markdown content"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: ${{ github.ref_name }}

      - name: Fail on unfixable math issues
        run: python scripts/check_math.py --check

      - name: Resolve checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: format
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.format.outputs.revision }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install plugins
        run: npx quartz plugin install

      - name: Set baseUrl for GitHub Pages
        run: |
          sed -i "s|baseUrl:.*|baseUrl: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}|" quartz.config.yaml

      - name: Build Quartz
        run: npx quartz build -d itmo-notebook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run script tests
        run: python -m unittest discover -s scripts/tests -t .

      - name: Require normalized content
        run: python scripts/normalize.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Quartz transformer tests
        run: npx tsx --test quartz/plugins/transformers/imageWidth.test.ts

      - name: Install plugins
        run: npx quartz plugin install

      - name: Set baseUrl for GitHub Pages
        run: |
          sed -i "s|baseUrl:.*|baseUrl: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}|" quartz.config.yaml

      - name: Build Quartz
        run: npx quartz build -d itmo-notebook

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
