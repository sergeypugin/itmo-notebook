name: Auto Format with EditorConfig

on:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_FORMAT_TOKEN || github.token }}
          # Если это PR, клонируем репозиторий-источник (даже если это форк)
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # По `.editorconfig` исправляем стиль
      - name: Fix EditorConfig rules
        run: npx eclint fix "**/*"

      # Откатываем правки в файлах воркфлоу, т.к. им не разрешен доступ на перезапись воркфлоу
      - name: Revert workflow modifications
        run: git checkout -- .github/workflows/ || true

      # Автоматически коммитим изменения
      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format via `.editorconfig` [skip ci]"
          # Используется [skip ci], чтобы предотвратить рекурсивный запуск
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_FORMAT_TOKEN }}
